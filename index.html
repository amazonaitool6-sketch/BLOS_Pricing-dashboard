<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balance Preis DE — Survive / Healthy / Thrive</title>
<style>
/* German/English balance-price surface. Reads the SAME live feed as the UK staff page
   (cppc-sandbox-viewer /balanceprice), so when Mani updates the vault the figures move with it.
   Nothing is copied by hand — that was the whole problem this page exists to solve.
   All four stages are shown — FLOOR, SURVIVE, HEALTHY, THRIVE — converted GBP -> EUR by the
   in-house factor below. Floor was deliberately withheld at first (it is a last resort, not a
   price, and a number on a page people scan invites someone to sell there); Mani asked for it on
   2026-10-28, so it is in, styled as the warning it is rather than as another price option. */
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#14181f; --mut:#5d6675; --line:#e2e6ec;
  --surv:#8a5a00; --survbg:#fff6e4; --heal:#0d6b3f; --healbg:#e8f7ee;
  /* Floor reads as a caution, not as a fourth price option — it is the one figure on this page
     nobody should be reaching for. */
  --flr:#9a4a16; --flrbg:#fcf1e8;
  --thrv:#1f4fd8; --thrvbg:#eaf0ff;
  /* Second listing column gets its own hue. Sharing the blue made the two listing headings read
     as one merged heading spanning both columns. */
  --alt:#7a3ea8; --altbg:#f5edfb;
  --warn:#8c1d1d; --warnbg:#fdeaea; --accent:#1f4fd8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116; --card:#161a21; --ink:#e8ecf2; --mut:#9aa4b4; --line:#252b35;
  --surv:#f0b658; --survbg:#2c2210; --heal:#67d19b; --healbg:#0f2a1c;
  --flr:#f0a06a; --flrbg:#2b1a0f;
  --thrv:#8fb0ff; --thrvbg:#141c33;
  --alt:#d8a8f5; --altbg:#241732;
  --warn:#ff8f8f; --warnbg:#2c1414; --accent:#7fa2ff;}}
*{box-sizing:border-box}
body{margin:0;padding:22px 18px 60px;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:13px}
/* Language switch. Two explicit buttons rather than one toggle: a single button has to be labelled
   with either the state or the action, and whichever you pick half the readers guess wrong. */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--card);flex:none}
.lang button{border:0;background:transparent;color:var(--mut);font:600 13px/1 inherit;
  padding:9px 15px;cursor:pointer;letter-spacing:.04em}
.lang button+button{border-left:1px solid var(--line)}
.lang button.on{background:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0}
.fx{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-size:13px}
.fx b{font-variant-numeric:tabular-nums}
input#q{flex:1;min-width:200px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font-size:14px}
/* Category picker. Same axis as the UK page's filter, so the two surfaces are navigated the same
   way and a category means the same thing on both. A native <select> rather than a custom popup:
   it takes keyboard input, renders as the phone's own picker for anyone reading this on the
   warehouse floor, and cannot get stuck open the way a hand-rolled dropdown can. */
.catbox{display:inline-flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:6px 8px 6px 13px;font-size:13px}
.catbox label{color:var(--mut);white-space:nowrap}
#cats,#skus{appearance:none;-webkit-appearance:none;background:transparent;color:var(--ink);
  border:0;font:600 14px/1.3 inherit;padding:3px 26px 3px 4px;cursor:pointer;max-width:52vw;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
    linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
#cats:focus,#skus:focus{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
#cats option,#skus option{background:var(--card);color:var(--ink);font-weight:400}
#skus{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
/* A picked SKU is a filter that hides 80 other rows, so it has to look switched on — an idle-
   looking control that is silently filtering is how someone concludes the data is missing. */
.catbox.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.note{margin:16px 0;padding:13px 15px;border-radius:10px;background:var(--warnbg);
  border:1px solid var(--line);border-left:4px solid var(--warn);font-size:13.5px}
.note b{color:var(--warn)}
.note .en{color:var(--mut);font-size:12.5px;display:block;margin-top:6px}
.ladder{margin:16px 0;padding:13px 15px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);border-left:4px solid var(--accent);font-size:13.5px}
.ladder div+div{margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tile .v{font-size:21px;font-weight:700;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.tile .n{font-size:11.5px;color:var(--mut)}
h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);
  margin:26px 0 4px;font-weight:600}
h2 .sub{text-transform:none;letter-spacing:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px}
.boxhead{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.boxname{font-weight:700;font-size:15px}
.tw{overflow-x:auto}
/* The money columns are the point of the page, so they get fixed width and the product column
   absorbs the rest — otherwise a long description pushes the figures off the right edge and the
   reader has to scroll sideways to see the only numbers they came for. */
table{border-collapse:collapse;width:100%;min-width:880px;table-layout:fixed}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;
  white-space:nowrap}
tr:last-child td{border-bottom:none}
th.n,td.n{text-align:right;white-space:nowrap;width:104px}
th.w56,td.w56{width:56px} th.fin,td.fin{width:118px} th.src,td.src{width:168px}
th .hsub{display:block;font-size:10px;text-transform:none;letter-spacing:0;opacity:.75;font-weight:400}
td:nth-child(3){word-break:break-word}
td.eur b{font-size:16px;font-variant-numeric:tabular-nums}
td.gbp{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
th.flr,td.flr{background:var(--flrbg)} td.flr b{color:var(--flr)}
th.surv,td.surv{background:var(--survbg)} td.surv b{color:var(--surv)}
th.heal,td.heal{background:var(--healbg)} td.heal b{color:var(--heal)}
th.thrv,td.thrv{background:var(--thrvbg)} td.thrv b{color:var(--thrv)}
td.src{font-size:11.5px;color:var(--mut);line-height:1.35}
img.thm,svg.thm{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);
  display:block;cursor:zoom-in;background:var(--bg);color:var(--mut)}
svg.thm{cursor:default}
.noimg{width:44px;height:44px;border-radius:6px;border:1px dashed var(--line);display:block}
.mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ref{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut)}
.desc{font-size:13.5px;margin-top:1px}
/* A machine-assisted translation is marked, and the English original stays one hover away. An
   unmarked German product name would end up quoted back to a supplier as if it were official. */
.desc.tr{border-bottom:1px dotted var(--line);cursor:help;display:inline-block}
.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:20px;
  border:1px solid var(--line);color:var(--mut);vertical-align:middle}
.p-warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.p-add{background:var(--healbg);color:var(--heal);border-color:transparent}
.addedsku{color:var(--ink);font-size:13px}
.ref s{opacity:.55}
#sgsave{background:var(--heal);border-color:var(--heal);color:#fff}
#sgremove{background:transparent;color:var(--warn);border-color:var(--line)}
#sgsend{background:transparent;color:var(--accent);border-color:var(--accent)}
.p-ok{background:var(--healbg);color:var(--heal);border-color:transparent}
.p-spread{background:var(--survbg);color:var(--surv);border-color:transparent}
/* Tabs */
.tabs{display:flex;gap:6px;margin:16px 0 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--mut);cursor:pointer;
  font:600 14px/1 inherit;padding:11px 15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
/* Calculator */
/* The VAT rate was queried once and settled. It stays recorded — quietly, not as a warning — so
   the next person to notice that 19% is the statutory rate finds the answer instead of reopening it. */
.vatnote{font-size:12.5px;color:var(--mut);margin:16px 0 0;line-height:1.5}
.calcbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin:16px 0}
.calcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.calcgrid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.calcgrid input,.calcgrid select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:15px/1.2 inherit;width:100%}
.calcgrid input:focus,.calcgrid select:focus{outline:2px solid var(--accent);outline-offset:1px}
.refresh{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:8px 13px;font:13px/1.2 inherit;cursor:pointer;white-space:nowrap}
.refresh:hover{border-color:var(--accent);color:var(--accent)}
.refresh:disabled{opacity:.55;cursor:default}
.calcfound{margin-top:12px;font-size:13px;color:var(--mut);min-height:20px}
.calcfound b{color:var(--ink)}
.calcfound .hit{display:inline-block;background:var(--healbg);color:var(--heal);
  border-radius:6px;padding:2px 8px;margin-right:7px;font-size:11.5px;font-weight:600}
.calcfound .miss{display:inline-block;background:var(--warnbg);color:var(--warn);
  border-radius:6px;padding:2px 8px;margin-right:7px;font-size:11.5px;font-weight:600}
/* The two scenarios sit SIDE BY SIDE so you can read one against the other without scrolling —
   stacked, the second table was off-screen exactly when you wanted to compare it with the first.
   Below 1150px there is no room for two, so they fall back to stacking. */
.calcwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:1150px){.calcwrap{grid-template-columns:1fr}}
.calcwrap .box{margin:0}
/* Compact: this is a dense figure table, not prose. Every row is ONE line — the stage name and its
   caption sit side by side rather than stacked, which is what halves the height. */
table.calc{min-width:430px}
/* Headings WRAP; figures do not. A wrapped "+2,61 €" is unreadable, but a heading forced onto one
   line is what pushes the table wide enough to need sideways scrolling in the first place. */
table.calc th,table.calc td{padding:4px 8px;white-space:normal;overflow-wrap:break-word}
table.calc th{font-size:9.5px;letter-spacing:.02em;line-height:1.25;vertical-align:bottom}
table.calc th .hsub{display:block;font-size:9.5px;margin-left:0}
table.calc td.add,table.calc td.bal,table.calc td.list,table.calc td.list2{white-space:nowrap}
table.calc td.add{font-size:12px}
table.calc td.bal{font-size:13px}
table.calc td.list b,table.calc td.list2 b{font-size:14px}
/* The stage column needs enough room for "Survive" + its caption on ONE line. Left to share width
   equally with the figure columns it got 90px, the caption wrapped to three lines, and every row
   became 46px tall — which is what made the table look big in the first place. */
table.calc th:first-child,table.calc td.tier{width:148px}
table.calc .tier{font-size:12.5px;font-weight:700}
table.calc .tier .cap{font-weight:400;font-size:10.5px;color:var(--mut);margin-left:5px;
  white-space:nowrap}
.calcwrap .boxhead{padding:6px 11px;display:block;white-space:normal}
.calcwrap .boxname{font-size:12.5px;display:inline}
.calcwrap .boxhead .sub{font-size:10.5px;display:inline;margin-left:7px}
table.calc td.n,table.calc th.n{width:auto}
table.calc .tier{font-weight:700;white-space:nowrap}
table.calc td.add{color:var(--mut);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.calc td.bal{background:var(--survbg);font-weight:700;text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
/* The two listing columns are DIFFERENT ANSWERS to different questions, not one wide result, so
   they get separate hues and a hard rule between them. Sharing a colour made the two headings read
   as a single merged heading and invited someone to take the wrong number. */
table.calc th.listA,table.calc td.list{background:var(--thrvbg);text-align:right;
  border-left:2px solid var(--thrv)}
table.calc th.listA{color:var(--thrv);white-space:normal}
table.calc td.list{white-space:nowrap}
table.calc td.list b{font-size:17px;color:var(--thrv);font-variant-numeric:tabular-nums}
table.calc th.listB,table.calc td.list2{background:var(--altbg);text-align:right;
  border-left:2px solid var(--alt);font-variant-numeric:tabular-nums}
table.calc th.listB{white-space:normal}
table.calc td.list2{white-space:nowrap}
table.calc th.listB{color:var(--alt)}
table.calc td.list2{font-weight:700;font-size:15px;color:var(--alt)}
table.calc th.listA .hsub,table.calc th.listB .hsub{opacity:.85}
/* Each scenario's box header carries its own hue, so the two tables are told apart at a glance
   while scrolling rather than by reading the title each time. */
.boxhead.listAhead{border-left:4px solid var(--thrv);background:var(--thrvbg)}
.boxhead.listAhead .boxname{color:var(--thrv)}
.boxhead.listBhead{border-left:4px solid var(--alt);background:var(--altbg)}
.boxhead.listBhead .boxname{color:var(--alt)}
table.calc td.list2{background:transparent}
table.calc td.list2 b{font-size:17px;color:var(--alt);font-variant-numeric:tabular-nums}
table.calc td.list,table.calc td.list2{border-left:2px solid var(--line)}
.plus{opacity:.5;font-weight:400;margin-right:3px}
.calcfoot{font-size:12px;color:var(--mut);margin:10px 0 0;line-height:1.55}
/* Suggest-a-fix. The people reading this page are the ones holding the physical product, so they
   are the best source for a wrong SKU or a missing one. Suggestions go to a review queue for Mani
   to approve — nothing typed here reaches a price or this page directly. */
.fixbtn{display:inline-block;margin-top:5px;background:transparent;border:1px solid var(--line);
  color:var(--mut);border-radius:7px;padding:3px 9px;font:12px/1.4 inherit;cursor:pointer}
.fixbtn:hover{border-color:var(--accent);color:var(--accent)}
.sgbox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:60}
.sgbox.on{display:flex}
.sgcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
  width:min(560px,100%);max-height:92vh;overflow:auto}
.sgcard h3{margin:0 0 3px;font-size:17px}
.sgcard .who{font-size:13px;color:var(--mut);margin-bottom:14px}
.sgcard label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
.sgcard input[type=text],.sgcard textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);font:15px/1.35 inherit}
.sgcard textarea{min-height:72px;resize:vertical}
.sgcard input:focus,.sgcard textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.sgprev{max-width:100%;max-height:190px;border-radius:8px;margin-top:9px;display:none}
.sgact{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sgact button{border-radius:8px;padding:9px 16px;font:600 14px/1 inherit;cursor:pointer;border:1px solid var(--line)}
#sgcancel{background:transparent;color:var(--mut)}
#sgsend{background:var(--accent);border-color:var(--accent);color:#fff}
#sgsend:disabled{opacity:.55;cursor:default}
.sgmsg{font-size:13px;margin-top:11px;min-height:18px}
.sgmsg.ok{color:var(--heal)} .sgmsg.bad{color:var(--warn)}
.sgnote{font-size:12px;color:var(--mut);margin-top:13px;line-height:1.5;
  border-top:1px solid var(--line);padding-top:11px}
.stamp{margin-top:22px;font-size:12px;color:var(--mut)}
.err{padding:14px;border-radius:10px;background:var(--warnbg);color:var(--warn)}
.fresh{position:fixed;right:16px;bottom:16px;background:var(--heal);color:#fff;padding:8px 14px;
  border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
.fresh.on{opacity:1}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.lbx.on{display:flex} .lbx img{max-width:92vw;max-height:88vh;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1 id="h1"></h1>
      <div class="sub" id="tagline"></div>
    </div>
    <div class="lang" id="lang">
      <button data-l="de">DEUTSCH</button><button data-l="en">ENGLISH</button>
    </div>
  </div>

  <div class="bar">
    <span class="lang" id="cur">
      <button data-c="eur">DE &nbsp;€</button><button data-c="gbp">UK &nbsp;£</button>
    </span>
    <span class="fx" id="fxbox"></span>
  </div>

  <div class="tabs" id="tabs">
    <button data-v="prices"></button><button data-v="calc"></button>
  </div>

  <div id="view-prices">
    <div class="bar">
      <button class="refresh" id="refresh" type="button"></button>
      <span class="catbox"><label for="cats" id="catlabel"></label><select id="cats"></select></span>
      <span class="catbox"><label for="skus" id="skulabel"></label><select id="skus"></select></span>
      <input id="q">
    </div>

    <div id="notes"></div>
    <div id="out"></div>
    <div class="stamp" id="stamp"></div>
  </div>

  <div id="view-calc" hidden>
    <!-- The calculator quotes listing prices off these balance figures, so the age of the data
         belongs here too, not only on the Prices tab. -->
    <div class="stamp" id="stamp2" style="margin:14px 0 0"></div>
    <div class="vatnote" id="calcWarn"></div>
    <div class="calcbox">
      <div class="calcgrid">
        <label><span id="lblSku"></span>
          <input id="cSku" list="cSkuList" autocomplete="off"><datalist id="cSkuList"></datalist></label>
        <label><span id="lblManual"></span>
          <input id="cManual" type="text" inputmode="decimal" autocomplete="off"></label>
        <label><span id="lblChan"></span>
          <select id="cChan">
            <option value="30">Amazon — 30%</option>
            <option value="25">eBay — 25%</option>
            <option value="20">Shopify — 20%</option>
          </select></label>
        <label><span id="lblFee"></span>
          <input id="cFee" type="text" inputmode="decimal" autocomplete="off"></label>
        <label><span id="lblVat"></span>
          <input id="cVat" type="text" inputmode="decimal" autocomplete="off"></label>
        <label><span id="lblExtra"></span>
          <input id="cExtra" type="text" inputmode="decimal" autocomplete="off"></label>
        <label><span id="lblPost"></span>
          <input id="cPost" type="text" inputmode="decimal" autocomplete="off"></label>
      </div>
      <div class="calcfound" id="cFound"></div>
    </div>
    <div id="calcOut"></div>
  </div>
</div>

<div class="fresh" id="fresh"></div>
<div class="lbx" id="lbx"><img id="lbximg" alt=""></div>

<div class="sgbox" id="sgbox">
  <div class="sgcard">
    <h3 id="sgtitle"></h3>
    <div class="who"><b id="sgsku"></b><span id="sgdesc"></span></div>

    <!-- Nothing here reports to Mani (Mani 2026-08-07: "no need to spot this to mani for german
         html"). So the fields that only existed to make a queue submission readable — your name,
         a note, a photo upload — are gone with it. What remains is the one thing that changes this
         screen: the SKU. The photo still comes from the feed automatically when the typed SKU
         exists on another row. -->
    <label for="sgcorrect" id="sglcorrect"></label>
    <input type="text" id="sgcorrect" autocomplete="off" spellcheck="false">

    <div class="sgmsg" id="sgmsg"></div>
    <div class="sgact">
      <button id="sgcancel" type="button"></button>
      <button id="sgremove" type="button" hidden></button>
      <button id="sgsave" type="button"></button>
    </div>
    <div class="sgnote" id="sglocalwhy"></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------------------------
   ONE source of truth. The UK staff page reads this same edge function; so does this page. The
   only transforms on this side are GBP -> EUR at the in-house factor, and language. If Mani
   changes a price in the vault, both surfaces move within seconds — which is exactly the failure
   this page was built to stop (German figures drifting behind because someone had to retype them).
   --------------------------------------------------------------------------------------------- */

   fittings like E27, dimensions, wattages) passes through untouched, which is correct: those are

/* Longest first so "Clear packing tape" beats "clear", built once rather than per row.
   Every term is fenced with \b where it begins or ends on a word character. Without that fence a
   regex alternation picks the LEFTMOST match, not the longest — so a short term like "out" sitting
   earlier in the string beats the long phrase it is part of, and "outdoor weatherproof enclosure"
   comes back as "Ausgängedoor weatherproof enclosure". Length ordering alone does not save you. */
const fence = k => (/^\w/.test(k) ? "\\b" : "")
  + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")
  + (/\w$/.test(k) ? "\\b" : "");
const DESC_RE = new RegExp(
  Object.keys(DESC_DE).sort((a,b)=>b.length-a.length).map(fence).join("|"), "g");
const DESC_LC = {}; Object.keys(DESC_DE).forEach(k=>DESC_LC[k.toLowerCase()]=DESC_DE[k]);

/* Patterns rather than fixed terms: these carry a number that has to survive into the German. */
const DESC_PAT = [
  [/(\d+)\s*in\s*\/\s*(\d+)\s*out\b/gi, "$1 Eingänge / $2 Ausgänge"],
  /* "100pc pack" — the term is glued to the digits, so no word boundary exists for the glossary
     fence to catch and it has to be matched as a pattern instead. */
  [/(\d+)pc pack\b/gi, "$1 Stück-Packung"],
  [/(\d+)-way\b/gi,  "$1-fach"],
  [/(\d+)-gang\b/gi, "$1-fach"],
  [/(\d+)-type\b/gi, "Typ-$1"],
  [/(\d+)in\b/g,     "$1 Zoll"],
  /* German decimal comma. Only where the number is followed by a unit, or is the low end of a
     range whose high end carries one ("0.85–0.9mm wall") — a blind swap would rewrite model codes
     like PCT-223 and TL-3335 into something the vault could never be searched for. */
  [/(\d)\.(\d+)(?=\s?[–—-]\s?\d+(?:\.\d+)?\s?(?:mm²|mm|cm|kg|m\b|W\b|V\b|A\b))/g, "$1,$2"],
  [/(\d)\.(\d+)(?=\s?(?:mm²|mm|cm|kg|m\b|W\b|V\b|A\b))/g, "$1,$2"]
];

function deDesc(s){
  if(!s) return s;
  let out = s.replace(DESC_RE, m => DESC_LC[m.toLowerCase()] ?? m);
  DESC_PAT.forEach(([re,to]) => { out = out.replace(re,to); });
  return out;
}
const catName  = c => (LANG==="de" && CAT_DE[c])  ? CAT_DE[c]  : c;
const typeName = v => (LANG==="de" && TYPE_DE[v]) ? TYPE_DE[v] : v;
const descName = v => (LANG==="de") ? deDesc(v) : v;

/* The feed carries 4 decimal places. The € is converted from the ROUNDED pound figure — the same
   one printed under it — so that a staff member who checks the sum on screen (£1.39 × 1.2) gets
   the number the page shows. Converting from full precision is fractionally more accurate but can
   land a cent away from the visible arithmetic, and on a reference page people cross-check by eye;
   an answer that looks wrong is worse than one that is half a cent off. These are guidance
   thresholds, not invoice amounts. */
const p2  = v => Math.round(Number(v)*100)/100;
/* Each currency keeps its own conventions — "7,32 €" and "£6.10". Formatting follows the MONEY, not
   the interface language: a euro amount written the British way would be read as a different number
   by the people it is for. */
const fmt = (v, cur) => cur === "eur"
  ? Number(v).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"
  : "£" + Number(v).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});

/* Feed pounds -> the currency on display. In UK mode `rate()` is 1, so the figure is the feed's own
   number with nothing done to it. */
const cur2 = g => p2(p2(g) * rate());
/* Primary figure, in the selected currency. */
const eur = v => (v==null||v==="") ? null : fmt(cur2(v), CUR);
/* The small cross-check line underneath, always the OTHER currency — so whichever view you are in,
   the figure you are not looking at is still one glance away. */
const gbp = v => (v==null||v==="") ? null :
  (CUR === "eur" ? "£" + p2(v).toFixed(2) : fmt(p2(p2(v)*FX), "eur"));

/* Switching currency also converts the postage field, so the real cost carries over instead of
   £4.99 silently standing in for €4.99 — the same number in two currencies is a different cost. */
$("cur").querySelectorAll("button").forEach(b => b.onclick = () => {
  const next = b.getAttribute("data-c");
  if(next === CUR) return;
  const post = num("cPost");
  if(isFinite(post) && post > 0){
    $("cPost").value = (next === "eur" ? p2(post * FX) : p2(post / FX))
      .toFixed(2).replace(".", next === "eur" ? "," : ".");
  }
  CUR = next;
  localStorage.setItem("bp_cur", CUR);
  paintChrome(); render(); paintCalcList(); renderCalc();
});

/* Report what actually failed. A render bug reported as a network outage sends whoever debugs it

  $("out").innerHTML = '<div class=err>'
    + (net ? esc(t("unreach")) : esc(t("rendfail"))+esc(e&&e.message||String(e))) + '</div>';

function showStamp(){

/* Manual refresh. The adaptive poll already picks changes up within seconds, but someone who has
   just been told "I've updated it" wants to confirm it NOW rather than trust a timer they cannot
   see. Goes through loadFull, so it is the same path as an automatic update. */
$("refresh").onclick = function(){
  const b = this;
  b.disabled = true; b.textContent = t("refreshing");
  loadFull(false).finally(() => { b.disabled = false; b.textContent = t("refresh"); });
};
function flash(){
  const f=$("fresh"); f.classList.add("on");
  clearTimeout(flash._t); flash._t=setTimeout(()=>f.classList.remove("on"),3500);
}

/* Options are keyed on the ENGLISH category, which is what the feed and the UK page use; only the
   label is translated. Switching language must never change which category you are looking at.
   The count rides in the label because "which of these actually has products in it" is the first
   thing anyone wants from this list. */
function renderCats(){
  const cats = [...new Set(ROWS.map(r=>r.category||"Other"))]
    .sort((a,b)=>catName(a).localeCompare(catName(b), LANG==="de"?"de":"en"));
  $("cats").innerHTML = cats.map(c =>
    '<option value="'+esc(c)+'"'+(c===CAT?' selected':'')+'>'+esc(catName(c))
    +' ('+ROWS.filter(r=>(r.category||"Other")===c).length+')</option>').join("");
}
/* Changing category clears the SKU pick. Carrying it over would filter the new category down to a
   SKU that does not live in it, and the page would come back empty for no reason the reader can see. */
$("cats").onchange = function(){ CAT = this.value; SKU = ""; render(); };

/* One option per SKU in the CURRENT category, so the list stays at most ~80 long instead of 317.
   The label carries the description because a PENDING reference on its own identifies nothing —
   "PENDING-226" tells a picker less than "Clear packing tape, 48mm × 50m" does. */
let skuCatPainted = null;
function renderSkus(catRows, force){
  if(!force && skuCatPainted === CAT+"|"+LANG) return;   // rebuilding mid-keystroke would close an open picker
  skuCatPainted = CAT+"|"+LANG;
  const sorted = catRows.slice().sort((a,b)=>String(a.seller_sku).localeCompare(String(b.seller_sku)));
  $("skus").innerHTML =
    '<option value="">'+esc(t("allSkus",catRows.length))+'</option>'
    + sorted.map(r=>{
        const d = descName(r.product_description||"");
        const lab = r.seller_sku + (d ? " — "+d : "");
        return '<option value="'+esc(r.seller_sku)+'"'+(r.seller_sku===SKU?' selected':'')+'>'
             + esc(lab.length>70 ? lab.slice(0,69)+"…" : lab)+'</option>';
      }).join("");
  $("skus").value = SKU;
}
$("skus").onchange = function(){ SKU = this.value; render(); };

function apply(j){
  ROWS  = j.rows || [];
  STAMP = j.published_at || null;
  const cats = [...new Set(ROWS.map(r=>r.category||"Other"))];
  if(!CAT || !cats.includes(CAT)) CAT = cats.includes(DEFAULT_CAT) ? DEFAULT_CAT : cats.sort()[0];
  skuCatPainted = null;            // a feed update can add, drop or re-describe SKUs
  indexImages();
  renderCats(); render(); showStamp();
  /* The calculator reads the same ROWS, so a live price change has to flow through to it too —
     otherwise the tab quietly keeps quoting a listing price built on a superseded Balance Price. */
  paintCalcList(); renderCalc();
}
function loadFull(first){
  return fetch(FEED,{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(!j.ok){ $("out").innerHTML='<div class=err>'+esc(t("loadfail"))+esc(j.error||"")+'</div>'; return; }
    apply(j);                       // apply() keeps the staff member on the category they were on
    if(!first) flash();
  }).catch(fail);
}

/* Adaptive poll, same shape as the source page: a 64-byte version check, hard while someone is
   actually using the page, slow when idle, off entirely when the tab is hidden. */
const POLL_ACTIVE=8000, POLL_IDLE=60000, ACTIVE_WINDOW=180000;
let lastTouch=Date.now(), pollTimer=null;
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>
  document.addEventListener(ev,()=>{lastTouch=Date.now();schedule();},{passive:true}));
function checkForUpdate(){
  if(document.hidden) return;
  fetch(FEED+"?meta=1",{cache:"no-store"}).then(r=>r.json()).then(m=>{
    if(m && m.ok && m.published_at && m.published_at!==STAMP) loadFull(false);
  }).catch(()=>{});   // a failed check is not worth showing; another is seconds away
}
function schedule(){
  clearTimeout(pollTimer);
  if(document.hidden) return;
  const active = (Date.now()-lastTouch) < ACTIVE_WINDOW;
  pollTimer = setTimeout(()=>{checkForUpdate();schedule();}, active?POLL_ACTIVE:POLL_IDLE);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ clearTimeout(pollTimer); return; }
  lastTouch=Date.now(); checkForUpdate(); schedule();
});

/* Click a photo to see it full size. Delegated from the document, so it survives every re-render

  const box=$("lbx");
  if(box.classList.contains("on")){ box.classList.remove("on"); return; }

/* =============================== GROUPING ====================================================
   This MUST match the UK page, or owner and staff read the same products two different ways.
   Some categories are a RANGE of unrelated products (tapes, bulbs, trunking) — those group by
   product_type. The rest are a SHAPE sold in several finishes (lampshades, ceiling roses) — those
   group by family_key, and each table is a finish ladder read cheapest first.
   Keys stay ENGLISH so grouping is identical in both languages; only labels translate.
   ============================================================================================ */
const GROUP_BY_TYPE = {"Bulbs":1,"PVC Trunking & Accessories":1,"Tile Levelling & Accessories":1,
                       "Adhesive tapes":1,"Mail bags":1};
function groupsByType(rows){
  if(GROUP_BY_TYPE[CAT]) return true;
  if(!rows || rows.length < 2) return false;
  return rows.filter(r=>r.product_type).length / rows.length >= 0.6;
}
function families(rows){
  const byType = groupsByType(rows), f = {};
  rows.forEach(r=>{
    const k = byType ? (r.product_type || (CAT==="Bulbs" ? "Other bulbs" : "Other"))
                     : (r.family_key || r.seller_sku);
    (f[k]=f[k]||[]).push(r);
  });
  return f;
}
/* Cheapest first, on FLOOR — the same axis the UK page sorts on, so a finish ladder reads in the
   same order on both surfaces even though Floor itself is not printed here. All four stages come
   off the same cost base, so this is also cheapest-first for the columns that ARE shown. */
const byLadder = (a,b) => (+a.net_floor_gbp||0)-(+b.net_floor_gbp||0)
  || String(a.finish_code||"").localeCompare(String(b.finish_code||""));
/* Cable & Flex block order (Mani): 2-core round, 2-core twisted, 3-core round, 3-core twisted,
   Hemp last — the way the range is actually thought about, not alphabetically. Matched on the
   English key, so the order holds in German too. */
const cableRank = n => {
  const m = /^(\d)-core (round|twisted)/.exec(n||''); if(!m) return null;
  return (/hemp/i.test(n)?100:0) + (+m[1]-2)*10 + (m[2]==='twisted'?1:0);
};

/* A colour-neutral pencil drawing for cable rows. A photo shows ONE colour; these rows deliberately
   speak for every colour, so the drawing is the honest picture. Hemp keeps its photo — it is a
   different MATERIAL, not a colour. */
function svgWrap(inner,title){
  return '<svg class="thm" style="border:none;background:none" viewBox="0 0 40 40" width="44" height="44"'
    +' role="img" aria-label="'+esc(title)+'"><title>'+esc(title)+'</title>'+inner+'</svg>';
}
function cableGlyph(fam){
  const m = /^CL(\d)([TR])[A-Z]{0,2}\|(.+)$/.exec(String(fam||"")); if(!m) return null;
  const cores=+m[1], twist=m[2]==="T", len=m[3];
  let inner="";
  if(twist){
    for(let i=0;i<cores;i++){
      const ph=(i*2*Math.PI)/cores; let d="";
      for(let x=4;x<=36;x+=2) d+=(x===4?"M":"L")+x+" "+(20+6*Math.sin((x-4)/5+ph)).toFixed(1);
      inner+='<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1.6" '
            +'stroke-linecap="round" opacity="'+(0.5+0.22*i).toFixed(2)+'"/>';
    }
  }else{
    inner+='<rect x="3" y="15.5" width="21" height="9" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>';
    inner+='<circle cx="31" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>';
    for(let i=0;i<cores;i++){
      const a=-Math.PI/2+(i*2*Math.PI)/cores;
      inner+='<circle cx="'+(31+3.1*Math.cos(a)).toFixed(1)+'" cy="'+(20+3.1*Math.sin(a)).toFixed(1)
            +'" r="1.7" fill="currentColor" opacity=".8"/>';
    }
  }
  const label = LANG==="de"
    ? cores+"-adrige "+(twist?"verdrillte Leitung":"Rundleitung")+" · "+len
    : cores+"-core "+(twist?"twisted":"round")+" cable · "+len;
  return svgWrap(inner, label);
}

function tiles(rows){
  const tile=(k,v,n)=>'<div class=tile><div class=k>'+esc(k)+'</div><div class=v>'+v
    +'</div><div class=n>'+esc(n||'')+'</div></div>';
  const med = a => { const s=a.filter(v=>isFinite(v)&&v>0).sort((x,y)=>x-y);
                     return s.length ? s[Math.floor(s.length/2)] : null; };
  const mh = med(rows.map(r=>+r.net_healthy_gbp));
  const withT = rows.filter(r=>r.net_thrive_gbp!=null);
  const ev = rows.filter(r=>["market evidence","finish evidence","set by Mani"].indexOf(r.ceiling_source)>=0).length;
  /* Headroom measured Survive -> Thrive, not Floor -> Thrive: Floor is not a level we sell at, so
     counting from it would inflate the number with money that was never on the table. */
  const head = withT.reduce((s,r)=> s + ((+r.net_thrive_gbp||0) - (+r.net_survive_gbp||0)), 0);
  const below = rows.filter(r=>r.market_below_floor).length;
  return '<div class=tiles>'
    + tile(t("tProducts"), rows.length, catName(CAT))
    + tile(t("tMedHeal"), mh==null?'—':eur(mh), t("tMedHealN"))
    + tile(t("tThriveSet"), withT.length+t("tOf")+rows.length, t("tThriveSetN", ev, withT.length-ev))
    + tile(t("tHead"), eur(head), t("tHeadN"))
    + (below ? tile(t("tBelow"), below, t("tBelowN")) : '')
    + '</div>';
}

function head(){
  return '<thead><tr><th class=w56></th><th class=fin>'+esc(t("colFinish"))+'</th>'
    + '<th>'+esc(t("colProduct"))+'</th>'
    + '<th class="n flr">Floor <span class=hsub>'+esc(t("colFloor"))+'</span></th>'
    + '<th class="n surv">Survive <span class=hsub>'+esc(t("colSurv"))+'</span></th>'
    + '<th class="n heal">Healthy <span class=hsub>'+esc(t("colHeal"))+'</span></th>'
    + '<th class="n thrv">Thrive <span class=hsub>'+esc(t("colThrv"))+'</span></th>'
    + '<th class=src>'+esc(t("colSrc"))+'</th></tr></thead>';
}
function cell(v, cls){
  if(v==null||v==="") return '<td class="n eur '+cls+'"><span class=ref>'+esc(t("notset"))+'</span></td>';
  return '<td class="n eur '+cls+'"><b>'+eur(v)+'</b><div class=gbp>'+gbp(v)+'</div></td>';
}

function row(r){
  const tier = (r.finish_tier||"").toLowerCase();
  const pend = !!r.needs_sku;
  const isCable = r.category === "Cable & Flex";
  const isHemp  = /hemp/i.test(r.product_type||"");
  const glyph = (isCable && !isHemp) ? cableGlyph(r.family_key)
              : (isCable && isHemp && !r.image_url) ? cableGlyph(r.family_key) : null;
  /* market_below_floor: the price the market actually pays sits UNDER our own floor. Shown rather
     than smoothed — the honest answer is that this product does not currently clear our minimum. */
  const mbf = !!r.market_below_floor;
  const rawDesc = r.product_description || "";
  const shown   = descName(rawDesc);
  const isTr    = LANG==="de" && shown !== rawDesc;
  const tierTxt = tier && tier!=="spray" ? ((FIN_TXT[tier]&&FIN_TXT[tier][LANG]) || tier) : null;
  const img = imageFor(r);
  const added = SKUADD[r.seller_sku];
  return '<tr>'
   + '<td class=w56>'+(glyph ? glyph
       : img ? '<img class=thm loading=lazy src="'+esc(img)+'" alt="">'
       : '<span class=noimg title="'+esc(t("nophoto"))+'"></span>')+'</td>'
   + '<td class="fin mono"><b>'+esc(r.finish_code||"—")+'</b>'
     + (tierTxt ? ' <span class=pill>'+esc(tierTxt)+'</span>' : '')+'</td>'
   + '<td>'
     + (rawDesc ? '<div class="desc'+(isTr?' tr':'')+'"'
         + (isTr ? ' title="'+esc(rawDesc)+'"' : '')+'>'+esc(shown)+'</div>' : '')
     /* When a SKU has been typed in, IT is the reference people will use, so it leads and the
        PENDING ref drops to a struck-through trace — keeping the old one first would leave the
        wrong reference as the most readable thing on the row. */
     + (added
        ? '<div class=ref><b class=addedsku>'+esc(added)+'</b> '
          + '<span class="pill p-add">'+esc(t("sgLocalPill"))+'</span> '
          + '<s>'+esc(r.seller_sku)+'</s></div>'
        : '<div class=ref>'+esc(r.seller_sku)
          + (pend ? ' <span class=pill>'+esc(t("skuPend"))+'</span>' : '')+'</div>')
     + (mbf ? '<div class=desc><span class="pill p-warn">'+esc(t("mbfPill"))+'</span> '
            + '<span class=ref>'+esc(t("mbfText"))+'</span></div>' : '')
     + '<button class=fixbtn data-sg="'+esc(r.seller_sku)+'" data-sgc="'+esc(r.category||"")+'">'
     + esc(pend ? t("fixKnow") : t("fixEdit"))+'</button>'
   + '</td>'
   + cell(r.net_floor_gbp,'flr')
   + cell(r.net_survive_gbp,'surv')
   + cell(r.net_healthy_gbp,'heal')
   + cell(r.net_thrive_gbp,'thrv')
   + '<td class=src>'+esc((SRC_TXT[r.ceiling_source]&&SRC_TXT[r.ceiling_source][LANG])
       || (LANG==="de"?"noch nicht gesetzt":"not set yet"))+'</td>'
   + '</tr>';
}

function render(){
  if($("cats").value !== CAT) $("cats").value = CAT;   // keep the picker in step with programmatic changes

  const catRows = ROWS.filter(r => (r.category||"Other") === CAT);
  /* The SKU list is built from the category BEFORE the SKU filter is applied — build it from the
     filtered rows and picking a SKU would leave that SKU as the only option you could ever pick. */
  renderSkus(catRows);
  if(SKU && !catRows.some(r=>r.seller_sku===SKU)) SKU = "";   // stale after a feed update
  $("skus").value = SKU;
  document.querySelectorAll(".catbox")[1].classList.toggle("active", !!SKU);

  let rows = SKU ? catRows.filter(r=>r.seller_sku===SKU) : catRows;
  /* Search covers BOTH languages at once: someone who reads the German page still gets handed
     English SKUs and English part numbers by everyone else, and typing either must work. */
  if(Q) rows = rows.filter(r =>
    ((r.seller_sku||"")+" "+(SKUADD[r.seller_sku]||"")+" "
     +(r.finish_code||"")+" "+(r.family_key||"")+" "
     +(r.product_type||"")+" "+typeName(r.product_type||"")+" "
     +(r.product_description||"")+" "+descName(r.product_description||""))
    .toLowerCase().indexOf(Q) >= 0);
  if(!rows.length){ $("out").innerHTML='<div class="sub" style="margin-top:14px">'+esc(t("nohits"))+'</div>'; return; }

  const byType = groupsByType(rows);
  const fam = families(rows);
  const label = k => byType ? typeName(k) : k;      // family keys are SKU stems — never translated
  const keys = Object.keys(fam).sort((a,b)=>{
    const ra=cableRank(a), rb=cableRank(b);
    if(ra!=null && rb!=null) return ra-rb;
    return label(a).localeCompare(label(b), LANG==="de"?"de":"en");
  });
  /* A type with a single product is still its own block when the whole category is ordered that
     way — pushing it into a mixed "single products" table hides it from the range it belongs to. */
  const oneBlockEach = keys.length>0 && keys.every(k=>cableRank(k)!=null);
  const multi   = oneBlockEach ? keys : keys.filter(k=>fam[k].length>1);
  const singles = oneBlockEach ? []   : keys.filter(k=>fam[k].length===1);

  let h = tiles(rows);

  const pending = rows.filter(r=>r.needs_sku).length;
  if(pending) h += '<div class=note style="border-left-color:var(--accent)">'+t("pendNote",pending)+'</div>';

  if(multi.length){
    h += '<h2>'+esc(byType ? t("byType") : t("byFam"))+'</h2>'
       + '<div class=sub>'+esc(byType ? t("byTypeSub") : t("byFamSub"))+'</div>';
    multi.forEach(k=>{
      const g = fam[k].slice().sort(byLadder);
      const v = g.map(x=>+x.net_healthy_gbp).filter(n=>n>0);
      const lo = Math.min.apply(null,v), hi = Math.max.apply(null,v);
      const uniform = v.length && lo>0 && (hi-lo)/lo <= 0.02;
      h += '<div class=box><div class=boxhead>'
        + '<div class=boxname>'+esc(label(k))+'</div>'
        + '<div class=sub>'+esc(byType ? t("nProd",g.length) : t("nVar",g.length))+' · '
        /* A type block is a set of unrelated products, so a spread badge there would read a range
           across different items as if it were a finish premium. State the range instead. */
        + (byType ? '<span class="pill">Healthy '+eur(lo)+(lo===hi?'':' – '+eur(hi))+'</span>'
           : uniform ? '<span class="pill p-ok">'+esc(t("onePrice",g.length))+'</span>'
                     : '<span class="pill p-spread">'+esc(t("spread",(hi/lo).toFixed(hi/lo<1.1?2:1)))+'</span>')
        + '</div></div>'
        + '<div class=tw><table>'+head()+'<tbody>'+g.map(row).join("")+'</tbody></table></div></div>';
    });
  }
  if(singles.length){
    h += '<h2>'+esc(byType ? t("singType") : t("singFam"))
       + ' <span class=sub>('+singles.length+esc(byType ? t("singTypeN") : t("singFamN"))+')</span></h2>'
       + '<div class=box><div class=tw><table>'+head()+'<tbody>'
       + singles.sort((a,b)=>label(a).localeCompare(label(b), LANG==="de"?"de":"en"))
           .map(k=>row(fam[k][0])).join("")+'</tbody></table></div></div>';
  }
  $("out").innerHTML = h;
}

/* ============================== ADD / CORRECT A SKU ==========================================
   Local only. Mani 2026-08-07: "no need to spot this to mani for german html" — so the submit-to-
   review-queue path, the estate endpoint and its public key are all removed. This page now makes
   exactly one network call, the read of the price feed, and sends nothing anywhere.
   Consequence worth knowing: a SKU entered here fixes THIS machine's view and nothing else. It does
   not reach the vault, so it will not appear for anyone else and will not correct a listing.
   ============================================================================================ */
let SG = {sku:null, cat:null};

/* ---- LOCALLY ADDED SKUs -------------------------------------------------------------------
   The feed is read-only from here: this page can display the vault, it cannot write to it. So a
   SKU typed in goes into localStorage and takes effect on this machine immediately, while the
   optional send to Mani is what makes it permanent for everyone. Both paths are offered rather
   than pretending the local entry has reached the vault — a SKU that looks saved but is not is
   how a wrong reference ends up on a listing.
   Keyed by the feed's own seller_sku (the PENDING ref), so a feed update that finally assigns the
   real SKU simply replaces the row and the override stops being consulted. */
const SKUADD_KEY = "bp_sku_added";

/* "If I add a SKU it needs to fetch the correct image": when the SKU typed in already exists

   because the feed reloads whenever Mani publishes. */

};

/* ============================== PRICE CALCULATION ============================================
   Works BACKWARDS from the Balance Price — the money that has to reach the business — to the
   listing price that still leaves it there once the channel, the tax office and the carrier have
   each taken their share.

     forward:  balance = listing × (1 − fee − vat − other) − postage
     reverse:  listing = (balance + postage) ÷ (1 − fee − vat − other)

   Every percentage is a share OF THE LISTING PRICE and they add together (Mani 2026-08-07: €0.85 at
   30% + 20% must list at €1.70). This does NOT match the Balance Price Checker in the German
   warehouse dashboard, which treats VAT as tax-on-net; see the note in priceFrom.

   ONE engine for every stage. Survive, Healthy and Thrive are not different calculations — they
   are the same calculation on a different starting figure, which is exactly why a manually typed
   amount can go through it untouched.
   ============================================================================================ */
/* EVERY percentage is a share OF THE LISTING PRICE, and they simply add up (Mani 2026-08-07:
   a €0.85 balance at 30% fee + 20% VAT must list at €1.70, i.e. 0.85 ÷ 0.50). So:

       balance = listing × (1 − fee − vat − other) − postage
       listing = (balance + postage) ÷ (1 − fee − vat − other)

   NOTE this differs from the Balance Price Checker in the German warehouse dashboard, which treats
   VAT as tax-on-net (`price / 1.20`) and charges the fee on the ex-VAT amount. On that basis the
   same €0.85 lands at €1.46, not €1.70. Mani's rule is the one implemented here; the checker will
   read lower for the same product until it is changed to match. */
function priceFrom(balance, feeRate, vatRate, postage, extraRate){
  extraRate = extraRate || 0;
  const take = feeRate + vatRate + extraRate;
  if(!(take < 1)) return null;                          // taking 100% or more has no solution
  const gross = p => Math.ceil(((balance + p) / (1-take)) * 100) / 100;
  const parts = (listing, p) => ({
    listing, fee: listing*feeRate, vat: listing*vatRate, extra: listing*extraRate, postage: p,
    /* what the seller is actually left with at the rounded-up listing price — always ≥ the target,
       never below it, which is the whole point of rounding up */
    net: listing*(1-take) - p
  });
  return { balance, incl: parts(gross(postage), postage), excl: parts(gross(0), 0) };
}

/* Calculator figures are ALREADY in the selected currency (the balance was converted before it got
   here), so this only formats — it must not convert again. */
const money = v => (v==null) ? "—" : fmt(v, CUR);

/* ONE table per shipping scenario. They were previously two result columns on one table, which
   meant the fee/VAT/postage breakdown belonged to the WITH-shipping price only and the
   WITHOUT-shipping figure sat there with no workings of its own — a number nobody could check.
   The two scenarios have genuinely different fee and VAT amounts, so they get a table each and
   every row adds up inside its own table. */
function calcRow(label, sub, part, balance, showPostage, resultClass){
  return '<tr>'
    + '<td class=tier>'+esc(label)+(sub?'<span class=cap>'+esc(sub)+'</span>':'')+'</td>'
    + '<td class=bal>'+money(balance)+'</td>'
    /* Selling fee and other costs are ONE column. Split out they showed identical euro figures
       whenever both rates were 20%, which read as the same number printed twice. The money is still
       in the calculation — the two rates are named in the header instead. */
    + '<td class=add><span class=plus>+</span>'+money(part.fee + part.extra)+'</td>'
    + '<td class=add><span class=plus>+</span>'+money(part.vat)+'</td>'
    + (showPostage ? '<td class=add><span class=plus>+</span>'+money(part.postage)+'</td>' : '')
    + '<td class="'+resultClass+'"><b>'+money(part.listing)+'</b></td>'
    + '</tr>';
}

function calcTable(results, opts){
  const anyExtra = results.some(r => r.res.incl.extra > 0);
  const head = '<thead><tr>'
    + '<th>'+esc(t("cTier"))+'</th>'
    + '<th class=n>'+esc(t("cBalance"))+' <span class=hsub>'+esc(t("cBalanceSub"))+'</span></th>'
    /* Each rate says what it is a percentage OF — without the base named, a 20% column and the 20%
       VAT column look like the same figure duplicated. */
    + (anyExtra
        ? '<th class=n>'+esc(t("cCosts"))+' <span class=hsub>'
          + esc(t("cCostsSub", opts.totalPct, opts.feePct, opts.extraPct))+'</span></th>'
        : '<th class=n>'+esc(t("cFee2"))+' <span class=hsub>'+esc(t("cOfNet",opts.feePct))+'</span></th>')
    + '<th class=n>'+esc(t("cVat2"))+' <span class=hsub>'+esc(t("cOfNet",opts.vatPct))+'</span></th>'
    + (opts.showPostage ? '<th class=n>'+esc(t("cPost2"))+'</th>' : '')
    + '<th class="n '+opts.headClass+'">'+esc(t("cResult"))+' <span class=hsub>'+esc(t("cResultSub"))+'</span></th>'
    + '</tr></thead>';
  return '<div class=box><div class="boxhead '+opts.headClass+'head">'
    + '<span class=boxname>'+esc(opts.title)+'</span>'
    + '<span class=sub>'+esc(opts.subtitle)+'</span></div>'
    + '<div class=tw><table class=calc>'+head+'<tbody>'
    + results.map(r => calcRow(r.name, r.sub, opts.pick(r.res), r.res.balance,
                              opts.showPostage, opts.cellClass)).join("")
    + '</tbody></table></div></div>';
}

/* German keyboards produce "7,49". Accept it everywhere rather than silently reading it as 7 or as
   nothing at all — a calculator that quietly drops the decimals is worse than one that refuses. */
const num = el => parseFloat(String($(el).value).trim().replace(/\s/g,"").replace(",","."));

function renderCalc(){
  const feeRate   = (num("cFee")||0)/100;
  const extraRate = (num("cExtra")||0)/100;
  const vatRate   = (num("cVat")||0)/100;
  const postage   = num("cPost")||0;
  const manual    = num("cManual");
  const skuTxt  = $("cSku").value.trim();
  /* A SKU the operator typed in on the Prices tab has to work here too, or the calculator is the
     one place that still cannot find the product by its real reference. */
  const hit = skuTxt ? ROWS.find(r=>String(shownSku(r)).toLowerCase()===skuTxt.toLowerCase()
                                 || String(r.seller_sku).toLowerCase()===skuTxt.toLowerCase()) : null;

  /* Status line first: the reader has to know WHICH number is being used before they read any
     figure derived from it. */
  let found = "";
  if(isFinite(manual) && manual>0){
    found = '<span class=hit>'+esc(t("cManualOn"))+'</span>'
          + (skuTxt ? '<span class=ref>'+esc(t("cOverride"))+'</span>' : '');
  } else if(hit){
    const d = descName(hit.product_description||"");
    found = '<span class=hit>'+esc(t("cFoundHit"))+'</span><b>'+esc(shownSku(hit))+'</b>'
          + (d ? ' — '+esc(d) : '') + ' <span class=ref>'+esc(catName(hit.category||""))+'</span>';
  } else if(skuTxt){
    found = '<span class=miss>'+esc(t("cFoundMiss"))+'</span>'+esc(t("cMissTxt"));
  }
  $("cFound").innerHTML = found;

  if(feeRate + vatRate + extraRate >= 1){
    $("calcOut").innerHTML='<div class=err>'+esc(t("cFeeBad2"))+'</div>'; return; }

  /* Stages come from the feed in GBP and are converted with the same rounded-pound rule the price
     tables use, so a Balance Price read off one tab is the same number the other tab starts from. */
  const stages = [];
  if(isFinite(manual) && manual>0){
    stages.push([t("cManualTier"), manual, null]);
  } else if(hit){
    const toEur = g => (g==null||g==="") ? null : cur2(g);   // feed £ -> selected currency
    [["Floor",  "net_floor_gbp",  t("colFloor")],
     ["Survive","net_survive_gbp",t("colSurv")],
     ["Healthy","net_healthy_gbp",t("colHeal")],
     ["Thrive", "net_thrive_gbp", t("colThrv")]].forEach(([nm,f,sub])=>{
      const v = toEur(hit[f]);
      if(v!=null) stages.push([nm, v, sub]);
    });
  }
  if(!stages.length){
    $("calcOut").innerHTML = '<div class="sub" style="margin-top:14px">'+esc(t("cNothing"))+'</div>';
    return;
  }

  const pct = r => (r*100).toFixed(1).replace(/\.0$/,"");
  const results = stages.map(([nm,val,sub]) =>
    ({name:nm, sub:sub, res:priceFrom(val, feeRate, vatRate, postage, extraRate)}))
    .filter(r => r.res);
  const common = {feePct:pct(feeRate), extraPct:pct(extraRate), vatPct:pct(vatRate),
                  totalPct:pct(feeRate+extraRate)};

  $("calcOut").innerHTML =
      '<div class=calcwrap>'
    + calcTable(results, Object.assign({}, common, {
        title: t("cListIncl"), subtitle: t("cListInclS"),
        showPostage: true, pick: r => r.incl, headClass:"listA", cellClass:"list" }))
    + calcTable(results, Object.assign({}, common, {
        title: t("cListExcl"), subtitle: t("cListExclS"),
        showPostage: false, pick: r => r.excl, headClass:"listB", cellClass:"list2" }))
    + '</div>'
    + '<div class=calcfoot>'+t("cFoot")+'</div>';
}

/* The channel sets the fee, but the fee stays editable afterwards — a rate can change without
   anyone being able to edit this file. */
$("cChan").onchange = function(){ $("cFee").value = this.value; renderCalc(); };
["cSku","cManual","cFee","cExtra","cVat","cPost"].forEach(id => $(id).oninput = renderCalc);

/* ================================ TABS ====================================================== */
let VIEW = "prices";
function paintTabs(){
  $("tabs").querySelectorAll("button").forEach(b=>{
    const v = b.getAttribute("data-v");
    b.textContent = t(v==="prices" ? "tabPrices" : "tabCalc");
    b.classList.toggle("on", v===VIEW);
  });
  $("view-prices").hidden = VIEW!=="prices";
  $("view-calc").hidden   = VIEW!=="calc";
}
$("tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
  VIEW = b.getAttribute("data-v"); paintTabs(); if(VIEW==="calc") renderCalc();
});

/* Germany defaults, per Mani: Amazon 30% / eBay 25% / Shopify 20%, VAT 20%, postage €4.99.
   Other costs default to 0 — Mani 2026-08-07: "dont calculate that 20 percentage". The field stays
   so a PPC/returns/handling allowance can be modelled deliberately, but nothing is added unless
   somebody types it. With it at 0 the Kosten column is the selling fee alone. */
$("cFee").value = "30"; $("cExtra").value = "0"; $("cVat").value = "20"; $("cPost").value = "4.99";

paintChrome();
paintCalcChrome();
paintSgChrome();
paintTabs();
$("out").innerHTML = '<div class=sub>'+esc(t("loading"))+'</div>';
schedule();
loadFull(true);
</script>
</body>
</html>
